<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - AdamFlix</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div
    id="loginPage"
    class="admin-login"
>

    <div class="login-box">

        <h1>
            ADAMFLIX
        </h1>

        <h2>
            Admin Login
        </h2>


        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button type="submit">
                Login
            </button>


            <p
                id="loginError"
                class="login-error"
            ></p>

        </form>

    </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
    id="adminPage"
    style="display:none;"
>


<header class="navbar">

    <div class="logo">
        ADAMFLIX ADMIN
    </div>


    <nav>

        <a href="/">
            Home
        </a>


        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </nav>

</header>


<main class="admin-container">


    <div class="admin-header">

        <div>

            <h1>
                Dashboard
            </h1>

            <p>
                Manage your movies
            </p>

        </div>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <section class="stats-grid">


        <div class="stat-card">

            <span>
                Total Movies
            </span>

            <strong id="totalMovies">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Genres
            </span>

            <strong id="totalGenres">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Latest Upload
            </span>

            <strong id="latestMovie">
                -
            </strong>

        </div>


    </section>


    <!-- =========================
         UPLOAD
    ========================= -->

    <section class="admin-panel">

        <h2>
            Upload Movie
        </h2>


        <form
            id="movieForm"
            enctype="multipart/form-data"
        >


            <div class="form-grid">


                <input
                    type="text"
                    name="title"
                    placeholder="Movie Title"
                    required
                >


                <input
                    type="number"
                    name="year"
                    placeholder="Year"
                    required
                >


                <input
                    type="text"
                    name="genre"
                    placeholder="Genre"
                    required
                >


                <input
                    type="number"
                    name="rating"
                    placeholder="Rating"
                    step="0.1"
                    min="0"
                    max="10"
                    required
                >


                <input
                    type="text"
                    name="duration"
                    placeholder="Duration"
                    required
                >

            </div>


            <textarea
                name="description"
                placeholder="Movie description"
                required
            ></textarea>


            <div class="file-grid">

                <label class="file-label">

                    <span>
                        Poster
                    </span>

                    <input
                        type="file"
                        name="poster"
                        accept="image/jpeg,image/png,image/webp"
                        required
                    >

                </label>


                <label class="file-label">

                    <span>
                        Video
                    </span>

                    <input
                        type="file"
                        name="video"
                        accept="video/mp4,video/webm"
                        required
                    >

                </label>

            </div>


            <button
                type="submit"
                class="upload-button"
            >
                Upload Movie
            </button>


            <p
                id="uploadMessage"
                class="upload-message"
            ></p>


        </form>

    </section>


    <!-- =========================
         MOVIE MANAGEMENT
    ========================= -->

    <section class="admin-panel">

        <div class="movie-list-header">

            <h2>
                Movies
            </h2>


            <input
                type="text"
                id="movieSearch"
                placeholder="Search movies..."
            >

        </div>


        <div id="movieList"></div>

    </section>


</main>

</div>


<!-- =========================
     EDIT MOVIE MODAL
========================= -->

<div
    id="editModal"
    class="edit-modal"
    style="display:none;"
>

    <div class="edit-modal-box">


        <div class="edit-modal-header">

            <h2>
                Edit Movie
            </h2>


            <button
                type="button"
                id="closeEditModal"
                class="edit-close"
            >
                ×
            </button>

        </div>


        <form
            id="editMovieForm"
            enctype="multipart/form-data"
        >


            <input
                type="hidden"
                id="editMovieId"
            >


            <label>
                Title
            </label>

            <input
                type="text"
                id="editTitle"
                required
            >


            <div class="edit-form-grid">


                <div>

                    <label>
                        Year
                    </label>

                    <input
                        type="number"
                        id="editYear"
                        required
                    >

                </div>


                <div>

                    <label>
                        Genre
                    </label>

                    <input
                        type="text"
                        id="editGenre"
                        required
                    >

                </div>


                <div>

                    <label>
                        Rating
                    </label>

                    <input
                        type="number"
                        id="editRating"
                        step="0.1"
                        min="0"
                        max="10"
                        required
                    >

                </div>


                <div>

                    <label>
                        Duration
                    </label>

                    <input
                        type="text"
                        id="editDuration"
                        required
                    >

                </div>


            </div>


            <label>
                Description
            </label>

            <textarea
                id="editDescription"
                required
            ></textarea>


            <!-- CURRENT POSTER -->

            <div class="edit-current-poster">

                <label>
                    Current Poster
                </label>

                <img
                    id="editPosterPreview"
                    src=""
                    alt="Current poster"
                    style="
                        width:120px;
                        height:170px;
                        object-fit:cover;
                        border-radius:6px;
                        margin-top:8px;
                    "
                >

            </div>


            <!-- REPLACE FILES -->

            <div class="file-grid">


                <label class="file-label">

                    <span>
                        Replace Poster
                    </span>

                    <input
                        type="file"
                        id="editPoster"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <small>
                        Leave empty to keep current poster
                    </small>

                </label>


                <label class="file-label">

                    <span>
                        Replace Video
                    </span>

                    <input
                        type="file"
                        id="editVideo"
                        accept="video/mp4,video/webm"
                    >

                    <small>
                        Leave empty to keep current video
                    </small>

                </label>


            </div>


            <p
                id="editMessage"
                class="edit-message"
            ></p>


            <div class="edit-modal-actions">


                <button
                    type="button"
                    id="cancelEdit"
                    class="edit-cancel-button"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="edit-save-button"
                >
                    Save Changes
                </button>


            </div>


        </form>

    </div>

</div>


<script src="admin.js"></script>

</body>

</html>
