<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin - AdamFlix
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==================================================
     LOGIN
================================================== -->

<div
    id="loginPage"
    class="admin-login"
>

    <div class="login-box">

        <h1>
            ADAMFLIX
        </h1>

        <h2>
            Admin Login
        </h2>


        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button type="submit">
                Login
            </button>


            <p
                id="loginError"
                class="login-error"
            ></p>

        </form>

    </div>

</div>


<!-- ==================================================
     ADMIN
================================================== -->

<div
    id="adminPage"
    style="display:none;"
>


<header class="navbar">

    <div class="logo">
        ADAMFLIX ADMIN
    </div>


    <nav>

        <a href="/">
            Home
        </a>


        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </nav>

</header>


<main class="admin-container">


    <div class="admin-header">

        <h1>
            Dashboard
        </h1>

        <p>
            Manage your movies
        </p>

    </div>


    <!-- ==================================================
         STATS
    ================================================== -->

    <section class="stats-grid">


        <div class="stat-card">

            <span>
                Total Movies
            </span>

            <strong id="totalMovies">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Genres
            </span>

            <strong id="totalGenres">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Latest Upload
            </span>

            <strong id="latestMovie">
                -
            </strong>

        </div>


    </section>


    <!-- ==================================================
         UPLOAD
    ================================================== -->

    <section class="admin-panel">

        <h2>
            Upload Movie
        </h2>


        <form
            id="movieForm"
            enctype="multipart/form-data"
        >


            <div class="form-grid">

                <input
                    type="text"
                    name="title"
                    placeholder="Movie Title"
                    required
                >


                <input
                    type="number"
                    name="year"
                    placeholder="Year"
                    required
                >


                <input
                    type="number"
                    name="rating"
                    placeholder="Rating"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >


                <input
                    type="text"
                    name="duration"
                    placeholder="Duration"
                    required
                >


                <!-- MULTI GENRE -->

                <div class="genre-admin-box">

                    <label class="genre-admin-title">
                        Genres
                    </label>

                    <input
                        type="hidden"
                        name="genre"
                        id="genreValue"
                    >

                    <div class="genre-checkbox-grid">

                        <label><input type="checkbox" class="upload-genre" value="Action">Action</label>
                        <label><input type="checkbox" class="upload-genre" value="Adventure">Adventure</label>
                        <label><input type="checkbox" class="upload-genre" value="Animation">Animation</label>
                        <label><input type="checkbox" class="upload-genre" value="Comedy">Comedy</label>
                        <label><input type="checkbox" class="upload-genre" value="Crime">Crime</label>
                        <label><input type="checkbox" class="upload-genre" value="Drama">Drama</label>
                        <label><input type="checkbox" class="upload-genre" value="Fantasy">Fantasy</label>
                        <label><input type="checkbox" class="upload-genre" value="Horror">Horror</label>
                        <label><input type="checkbox" class="upload-genre" value="Mystery">Mystery</label>
                        <label><input type="checkbox" class="upload-genre" value="Romance">Romance</label>
                        <label><input type="checkbox" class="upload-genre" value="Sci-Fi">Sci-Fi</label>
                        <label><input type="checkbox" class="upload-genre" value="Thriller">Thriller</label>
                        <label><input type="checkbox" class="upload-genre" value="Family">Family</label>
                        <label><input type="checkbox" class="upload-genre" value="Documentary">Documentary</label>
                        <label><input type="checkbox" class="upload-genre" value="War">War</label>
                        <label><input type="checkbox" class="upload-genre" value="History">History</label>

                    </div>

                </div>

            </div>


            <textarea
                name="description"
                placeholder="Movie description"
                required
            ></textarea>


            <div class="file-grid">


                <label class="file-label">

                    <span>
                        Poster
                    </span>

                    <input
                        type="file"
                        name="poster"
                        accept="image/jpeg,image/png,image/webp"
                        required
                    >

                </label>


                <label class="file-label">

                    <span>
                        Video
                    </span>

                    <input
                        type="file"
                        name="video"
                        accept="video/mp4,video/webm"
                        required
                    >

                </label>


            </div>


            <button
                type="submit"
                id="uploadButton"
                class="upload-button"
            >
                Upload Movie
            </button>


            <p
                id="uploadMessage"
                class="upload-message"
            ></p>


            <!-- ==================================================
                 TWO STAGE PROGRESS
            ================================================== -->

            <div
                id="uploadProgressPanel"
                class="two-stage-upload"
                style="display:none;"
            >


                <div class="upload-stage">

                    <div class="upload-stage-header">

                        <span>
                            1. Upload to server
                        </span>

                        <strong
                            id="serverProgressText"
                        >
                            0%
                        </strong>

                    </div>


                    <div class="upload-progress-track">

                        <div
                            id="serverProgressBar"
                            class="upload-progress-bar"
                            style="width:0%;"
                        ></div>

                    </div>

                </div>


                <div class="upload-stage">

                    <div class="upload-stage-header">

                        <span>
                            2. Upload to Cloudflare R2
                        </span>

                        <strong
                            id="r2ProgressText"
                        >
                            0%
                        </strong>

                    </div>


                    <div class="upload-progress-track">

                        <div
                            id="r2ProgressBar"
                            class="upload-progress-bar"
                            style="width:0%;"
                        ></div>

                    </div>

                </div>


                <p
                    id="uploadStageMessage"
                    class="upload-stage-message"
                >
                    Preparing...
                </p>


            </div>


        </form>

    </section>


    <!-- ==================================================
         MOVIES
    ================================================== -->

    <section class="admin-panel">


        <div class="movie-list-header">

            <h2>
                Movies
            </h2>


            <input
                type="text"
                id="movieSearch"
                placeholder="Search movies..."
            >

        </div>


        <div id="movieList"></div>


    </section>


</main>

</div>


<!-- ==================================================
     EDIT MODAL
================================================== -->

<div
    id="editModal"
    class="edit-modal"
    style="display:none;"
>

    <div class="edit-modal-box">


        <div class="edit-modal-header">

            <h2>
                Edit Movie
            </h2>


            <button
                type="button"
                id="closeEditModal"
                class="edit-close"
            >
                ×
            </button>

        </div>


        <form
            id="editMovieForm"
            enctype="multipart/form-data"
        >


            <input
                type="hidden"
                id="editMovieId"
            >


            <label>
                Title
            </label>

            <input
                type="text"
                id="editTitle"
                required
            >


            <div class="edit-form-grid">


                <div>

                    <label>
                        Year
                    </label>

                    <input
                        type="number"
                        id="editYear"
                        required
                    >

                </div>


                <div>

                    <label>
                        Rating
                    </label>

                    <input
                        type="number"
                        id="editRating"
                        min="0"
                        max="10"
                        step="0.1"
                        required
                    >

                </div>


                <div>

                    <label>
                        Duration
                    </label>

                    <input
                        type="text"
                        id="editDuration"
                        required
                    >

                </div>


            </div>


            <div class="genre-admin-box">

                <label class="genre-admin-title">
                    Genres
                </label>

                <div class="genre-checkbox-grid">

                    <label><input type="checkbox" class="edit-genre" value="Action">Action</label>
                    <label><input type="checkbox" class="edit-genre" value="Adventure">Adventure</label>
                    <label><input type="checkbox" class="edit-genre" value="Animation">Animation</label>
                    <label><input type="checkbox" class="edit-genre" value="Comedy">Comedy</label>
                    <label><input type="checkbox" class="edit-genre" value="Crime">Crime</label>
                    <label><input type="checkbox" class="edit-genre" value="Drama">Drama</label>
                    <label><input type="checkbox" class="edit-genre" value="Fantasy">Fantasy</label>
                    <label><input type="checkbox" class="edit-genre" value="Horror">Horror</label>
                    <label><input type="checkbox" class="edit-genre" value="Mystery">Mystery</label>
                    <label><input type="checkbox" class="edit-genre" value="Romance">Romance</label>
                    <label><input type="checkbox" class="edit-genre" value="Sci-Fi">Sci-Fi</label>
                    <label><input type="checkbox" class="edit-genre" value="Thriller">Thriller</label>
                    <label><input type="checkbox" class="edit-genre" value="Family">Family</label>
                    <label><input type="checkbox" class="edit-genre" value="Documentary">Documentary</label>
                    <label><input type="checkbox" class="edit-genre" value="War">War</label>
                    <label><input type="checkbox" class="edit-genre" value="History">History</label>

                </div>

            </div>


            <label>
                Description
            </label>


            <textarea
                id="editDescription"
                required
            ></textarea>


            <div class="edit-current-poster">

                <label>
                    Current Poster
                </label>


                <img
                    id="editPosterPreview"
                    src=""
                    alt="Poster"
                >

            </div>


            <div class="file-grid">


                <label class="file-label">

                    <span>
                        Replace Poster
                    </span>

                    <input
                        type="file"
                        id="editPoster"
                        accept="image/jpeg,image/png,image/webp"
                    >

                </label>


                <label class="file-label">

                    <span>
                        Replace Video
                    </span>

                    <input
                        type="file"
                        id="editVideo"
                        accept="video/mp4,video/webm"
                    >

                </label>


            </div>


            <p
                id="editMessage"
                class="edit-message"
            ></p>


            <div class="edit-modal-actions">


                <button
                    type="button"
                    id="cancelEdit"
                    class="edit-cancel-button"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="edit-save-button"
                >
                    Save Changes
                </button>


            </div>


        </form>


    </div>

</div>


<script src="admin.js"></script>

</body>

</html>
