<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AdamFlix</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header
    id="mainNavbar"
    class="navbar home-navbar"
>

    <div class="logo">
        ADAMFLIX
    </div>


    <nav class="desktop-nav">

        <a href="#home">
            Home
        </a>

        <a href="#latest">
            Movies
        </a>

        <a href="#trending">
            Trending
        </a>

    </nav>


    <div class="nav-actions">

        <button
            id="mobileSearchButton"
            class="mobile-icon-button"
            type="button"
            aria-label="Search"
        >
            🔎
        </button>


        <div class="nav-search">

            <input
                type="text"
                id="navSearch"
                placeholder="Search..."
            >

        </div>


        <button
            id="mobileMenuButton"
            class="mobile-icon-button"
            type="button"
            aria-label="Menu"
        >
            ☰
        </button>

    </div>

</header>


<!-- =========================
     MOBILE MENU
========================= -->

<div
    id="mobileMenu"
    class="mobile-menu"
>

    <a href="#home">
        Home
    </a>

    <a href="#latest">
        Latest Movies
    </a>

    <a href="#trending">
        Trending
    </a>

    <a href="#continueSection">
        Continue Watching
    </a>

    <a href="#myListSection">
        My List
    </a>

</div>


<!-- =========================
     MOBILE SEARCH
========================= -->

<div
    id="mobileSearchPanel"
    class="mobile-search-panel"
>

    <input
        type="text"
        id="mobileSearch"
        placeholder="Search movies..."
    >

</div>


<!-- =========================
     HERO
========================= -->

<section
    id="home"
    class="home-hero"
>

    <div
        id="heroBackdrop"
        class="hero-backdrop"
    ></div>


    <div class="hero-shade"></div>


    <div class="hero-content">

        <span class="hero-badge">
            FEATURED
        </span>


        <h1 id="heroTitle">
            Loading...
        </h1>


        <div
            id="heroMeta"
            class="hero-meta"
        ></div>


        <p id="heroDescription">
            Loading movie...
        </p>


        <div class="hero-actions">

            <button
                id="heroWatchButton"
                class="hero-primary-button"
                type="button"
            >
                ▶ Watch Now
            </button>


            <button
                id="heroInfoButton"
                class="hero-secondary-button"
                type="button"
            >
                More Info
            </button>

        </div>

    </div>

</section>


<main>


    <!-- =========================
         SEARCH
    ========================= -->

    <section class="home-search-section">

        <div class="home-search-box">

            <span>
                🔎
            </span>


            <input
                type="text"
                id="searchInput"
                placeholder="Search movies by title or genre..."
            >

        </div>

    </section>


    <!-- =========================
         GENRE FILTER
    ========================= -->

    <section
        id="genreSection"
        class="genre-section"
    >

        <button
            class="genre-button active"
            data-genre="All"
            type="button"
        >
            All
        </button>

    </section>


    <!-- =========================
         SEARCH RESULTS
    ========================= -->

    <section
        id="searchSection"
        class="movie-section hidden"
    >

        <div class="section-heading">

            <h2>
                Search Results
            </h2>


            <button
                id="clearSearchButton"
                class="section-action-button"
                type="button"
            >
                Clear
            </button>

        </div>


        <div
            id="searchResults"
            class="movie-grid"
        ></div>


        <div
            id="searchEmpty"
            class="empty-state"
            style="display:none;"
        >

            <div class="empty-icon">
                🎬
            </div>

            <h3>
                No movies found
            </h3>

            <p>
                Try another title or genre.
            </p>

        </div>

    </section>


    <!-- =========================
         CONTINUE WATCHING
    ========================= -->

    <section
        id="continueSection"
        class="movie-section"
    >

        <div class="section-heading">

            <h2>
                Continue Watching
            </h2>

        </div>


        <div
            id="continueMovies"
            class="movie-row"
        ></div>

    </section>


    <!-- =========================
         LATEST
    ========================= -->

    <section
        id="latest"
        class="movie-section"
    >

        <div class="section-heading">

            <h2>
                Latest Movies
            </h2>

        </div>


        <div
            id="latestMovies"
            class="movie-row"
        ></div>

    </section>


    <!-- =========================
         TRENDING
    ========================= -->

    <section
        id="trending"
        class="movie-section"
    >

        <div class="section-heading">

            <h2>
                Trending
            </h2>

        </div>


        <div
            id="trendingMovies"
            class="movie-row"
        ></div>

    </section>


    <!-- =========================
         MY LIST
    ========================= -->

    <section
        id="myListSection"
        class="movie-section"
    >

        <div class="section-heading">

            <h2>
                My List
            </h2>

        </div>


        <div
            id="myListMovies"
            class="movie-row"
        ></div>

    </section>


</main>


<footer class="home-footer">

    <div class="logo">
        ADAMFLIX
    </div>

    <p>
        Stream anytime.
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
